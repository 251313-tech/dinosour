<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고양시 약국 지도</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Malgun Gothic', sans-serif;
        }
        #container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        #sidebar {
            width: 350px;
            height: 100%;
            background: #f8f9fa;
            border-right: 1px solid #dee2e6;
            display: flex;
            flex-direction: column;
        }
        #sidebar .header {
            padding: 20px;
            background: #007bff;
            color: white;
        }
        #sidebar .header h1 {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        #sidebar .header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }
        #placesList {
            flex: 1;
            overflow-y: auto;
            list-style: none;
            padding: 10px;
        }
        #placesList li {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #e9ecef;
            cursor: pointer;
            transition: background 0.2s;
        }
        #placesList li:hover {
            background: #e9ecef;
        }
        #placesList .title {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        #placesList .address {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 3px;
        }
        #placesList .phone {
            font-size: 0.8rem;
            color: #28a745;
        }
        #map {
            flex: 1;
            height: 100%;
        }
        /* Custom Overlay Style */
        .info-window {
            padding: 10px;
            font-size: 12px;
            color: #333;
            background: #fff;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
    </style>
    <!-- 카카오맵 API (Services 라이브러리 포함) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=3a994b47b79d09a15e73ae1f286b011a&libraries=services"></script>
</head>
<body>

<div id="container">
    <div id="sidebar">
        <div class="header">
            <h1>고양시 약국 검색</h1>
            <p id="statusCount">약국 정보를 불러오는 중...</p>
        </div>
        <ul id="placesList"></ul>
    </div>
    <div id="map"></div>
</div>

<script>
    // 고양시청 중심 좌표 설정
    const mapContainer = document.getElementById('map');
    const mapOptions = {
        center: new kakao.maps.LatLng(37.6584, 126.8320), // 고양시 중심부
        level: 5
    };

    const map = new kakao.maps.Map(mapContainer, mapOptions);
    const ps = new kakao.maps.services.Places();
    const infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });
    
    let markers = [];

    // 키워드로 장소 검색 (고양시 약국)
    searchPharmacies();

    function searchPharmacies() {
        // PM9: 약국 카테고리 코드 사용
        ps.categorySearch('PM9', placesSearchCB, {
            location: new kakao.maps.LatLng(37.6584, 126.8320),
            radius: 10000 // 중심좌표 기준 반경 10km 내 검색
        });
    }

    // 장소검색 완료 시 호출되는 콜백함수
    function placesSearchCB(data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
            displayPlaces(data);
            document.getElementById('statusCount').innerText = `총 ${data.length}개의 약국이 검색되었습니다.`;
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            alert('검색 결과가 존재하지 않습니다.');
        } else if (status === kakao.maps.services.Status.ERROR) {
            alert('검색 결과 중 오류가 발생했습니다.');
        }
    }

    // 검색 결과 목록과 마커를 표출하는 함수
    function displayPlaces(places) {
        const listEl = document.getElementById('placesList');
        const bounds = new kakao.maps.LatLngBounds();

        // 기존 마커 및 리스트 초기화
        removeAllMarkers();
        listEl.innerHTML = '';

        for (let i = 0; i < places.length; i++) {
            const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
            const marker = addMarker(placePosition, i);
            const itemEl = getListItem(i, places[i]);

            bounds.extend(placePosition);

            // 마커 및 리스트 아이템 이벤트 등록
            (function(marker, title, address, phone) {
                kakao.maps.event.addListener(marker, 'click', function() {
                    displayInfowindow(marker, title);
                });

                itemEl.onclick = function() {
                    displayInfowindow(marker, title);
                    map.panTo(marker.getPosition());
                };
            })(marker, places[i].place_name);

            listEl.appendChild(itemEl);
        }

        // 검색된 장소 위치를 기준으로 지도 범위 재설정
        map.setBounds(bounds);
    }

    // 마커 생성 함수
    function addMarker(position, idx) {
        const marker = new kakao.maps.Marker({
            position: position,
            map: map
        });

        markers.push(marker);
        return marker;
    }

    // 기존 마커 제거
    function removeAllMarkers() {
        for (let i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }
        markers = [];
    }

    // 목록 엘리먼트 생성
    function getListItem(index, places) {
        const el = document.createElement('li');
        el.innerHTML = `
            <div class="title">${places.place_name}</div>
            <div class="address">${places.road_address_name || places.address_name}</div>
            <div class="phone">${places.phone || '전화번호 정보 없음'}</div>
        `;
        return el;
    }

    // 인포윈도우 표시
    function displayInfowindow(marker, title) {
        const content = `<div style="padding:5px;z-index:1;font-size:12px;">${title}</div>`;
        infowindow.setContent(content);
        infowindow.open(map, marker);
    }
</script>
</body>
</html>
